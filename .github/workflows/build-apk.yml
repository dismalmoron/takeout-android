name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu runners include the Android SDK at /usr/local/lib/android/sdk.
      # Export it so Gradle finds it; skip the setup-android action which
      # currently fails trying to install the deprecated 'tools' package.
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: takeout-index-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
